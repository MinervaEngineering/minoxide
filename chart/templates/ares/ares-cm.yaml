{{ if .Values.ares.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ares-configmap
data:
  GONERVA_HOST: {{ .Values.ares.configmap.gonerva_host | quote }}
  RABBIT_HOST: {{ .Values.ares.configmap.rabbit_host | quote }}
  RABBIT_PORT: {{ .Values.ares.configmap.rabbit_port | quote }}
  RABBIT_VIRTUAL_HOST: {{ .Values.ares.configmap.rabbit_virtual_host | quote }}
{{ end }}